# Execute com: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Antes, crie o banco:  CREATE DATABASE baozidb;
spring.datasource.url=jdbc:mysql://localhost:3306/baozidb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
